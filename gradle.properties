# Performance: keep a warm daemon and reuse configuration between builds.
# The device is RAM-limited, so keep parallelism conservative.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process
android.aapt2FromMavenOverride=/workspace/toolchain/bin/aapt2
# R8 full mode uses much more memory; the device is RAM-limited, so use compat mode.
android.enableR8.fullMode=false
