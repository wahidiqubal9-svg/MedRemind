# This device is memory-constrained (heavy swap), so keep Gradle lean: a warm
# daemon + configuration cache for speed, but a modest heap and no parallelism.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.workers.max=3
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process
android.aapt2FromMavenOverride=/workspace/toolchain/bin/aapt2
android.enableR8.fullMode=false
